[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robot-pathfinding-core"
dynamic = ["version"]
description = "Core library of robot searching and pathfinding algorithms — pure Python standard library, zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Richard" }]
keywords = ["robotics", "pathfinding", "search", "algorithms", "graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6,<0.17",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "commitizen>=4.16",
]

[project.urls]
Homepage = "https://gitlab.com/robot-pathfinding-ros2-platfrom/robot-pathfinding-core"
Repository = "https://gitlab.com/robot-pathfinding-ros2-platfrom/robot-pathfinding-core"
Changelog = "https://gitlab.com/robot-pathfinding-ros2-platfrom/robot-pathfinding-core/-/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/robot_pathfinding/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_pathfinding"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "commitizen"
version = "1.0.0"
tag_format = "v$version"
version_scheme = "semver"
major_version_zero = false
bump_message = "bump(release): $current_version → $new_version [skip ci]"
version_files = [
    "src/robot_pathfinding/__init__.py:__version__",
    "VERSION.txt:version",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["robot_pathfinding"]
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
