[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robot-pathfinding-core"
dynamic = ["version"]
description = "Core library of robot searching and pathfinding algorithms — pure Python standard library, zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Richard" }]
keywords = ["robotics", "pathfinding", "search", "algorithms", "graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Runtime is intentionally dependency-free: the library uses only the Python
# standard library. Do NOT add runtime dependencies here.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/Richard/Robot-Pathfinding-Core"
Repository = "https://github.com/Richard/Robot-Pathfinding-Core"
Changelog = "https://github.com/Richard/Robot-Pathfinding-Core/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/robot_pathfinding/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_pathfinding"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["robot_pathfinding"]
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
