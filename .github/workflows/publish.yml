name: Publish

on:
  push:
    branches: [staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  publish:
    name: Build and publish release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Compute build version
        id: version
        run: |
          base=$(python -c "import re, pathlib; print(re.search(r'^__version__ = \"([^\"]+)\"', pathlib.Path('src/robot_pathfinding/__init__.py').read_text(), re.M).group(1))")
          full="${base}.dev${{ github.run_number }}"
          echo "full=${full}" >> "$GITHUB_OUTPUT"
          echo "tag=v${full}" >> "$GITHUB_OUTPUT"

      - name: Stamp unique version into the package
        run: |
          sed -i 's/^__version__ = .*/__version__ = "${{ steps.version.outputs.full }}"/' src/robot_pathfinding/__init__.py

      - name: Build wheel and sdist
        run: python -m build

      - name: Create GitHub pre-release with artifacts
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "Automated staging build of robot-pathfinding-core ${{ steps.version.outputs.full }} (commit ${GITHUB_SHA::7})."
