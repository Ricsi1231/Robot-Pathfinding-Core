name: Release

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  release:
    name: Build and publish GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.create.outputs.created }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve package version
        id: version
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import robot_pathfinding; print(robot_pathfinding.__version__)")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version ${version}."

      - name: Inspect existing release and tag
        id: state
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip a release that already exists
        if: steps.state.outputs.release_exists == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          message="Release $TAG already exists - nothing to publish. Bump __version__ on dev and merge to staging to cut a new release."
          echo "$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

      - name: Install build tooling
        if: steps.state.outputs.release_exists == 'false'
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        if: steps.state.outputs.release_exists == 'false'
        run: python -m build

      - name: Extract release notes from the changelog
        id: notes
        if: steps.state.outputs.release_exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if python scripts/changelog_section.py "$VERSION" > "$RUNNER_TEMP/release-notes.md"; then
            echo "source=changelog" >> "$GITHUB_OUTPUT"
            echo "Using the CHANGELOG.md section for $VERSION."
          else
            rm -f "$RUNNER_TEMP/release-notes.md"
            echo "source=generated" >> "$GITHUB_OUTPUT"
            echo "No CHANGELOG.md section for $VERSION - falling back to generated notes."
          fi

      - name: Create the GitHub release
        id: create
        if: steps.state.outputs.release_exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          TAG_EXISTS: ${{ steps.state.outputs.tag_exists }}
          NOTES_SOURCE: ${{ steps.notes.outputs.source }}
          DRAFT: ${{ inputs.draft }}
        run: |
          args=("$TAG" dist/*.whl dist/*.tar.gz --title "robot-pathfinding-core $TAG")
          if [ "$TAG_EXISTS" = "true" ]; then
            echo "Reusing the existing tag $TAG."
          else
            echo "Tag $TAG does not exist yet - creating it at $GITHUB_SHA."
            args+=(--target "$GITHUB_SHA")
          fi
          if [ "$NOTES_SOURCE" = "changelog" ]; then
            args+=(--notes-file "$RUNNER_TEMP/release-notes.md")
          else
            args+=(--generate-notes)
          fi
          if [ "$DRAFT" = "true" ]; then
            args+=(--draft)
          fi
          gh release create "${args[@]}"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Published $TAG." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload distributions
        if: steps.state.outputs.release_exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.created == 'true' && vars.ENABLE_PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/robot-pathfinding-core
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@v1.14.2
